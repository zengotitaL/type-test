<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Video Pages</title>
<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

#page {
    width:8in;
    height:9in;
    position:relative;
    background:black;
    overflow:hidden;
    user-select:none;
}

#videoContainer {
    position:absolute;
    inset:0;
    z-index:1;
}

video {
    width:100%;
    height:100%;
    object-fit:cover;
    background:black;
    transition:transform 0.5s ease;
}

#overlay {
    position:absolute;
    inset:0;
    background:black;
    color:white;
    font-size:32px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    z-index:20;
}

#pageNumber {
    position:absolute;
    bottom:5px;
    right:10px;
    color:black;
    font-size:28px;
    opacity:0.8;
    z-index:25;
    pointer-events:none;
}

/* Play Bar */
#playBar {
    position:absolute;
    bottom:56px;
    left:18px;
    width:calc(100% - 90px);
    z-index:30;
    appearance:none;
    height:4px;
    border-radius:3px;
    background:#444;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
}

#playBar::-webkit-slider-runnable-track {
    height:4px;
    background:#444;
    border-radius:3px;
}

#playBar::-webkit-slider-thumb {
    appearance:none;
    width:16px;
    height:16px;
    border-radius:50%;
    background:white;
    margin-top:-6px;
}

/* Playback speed button */
#snailBtn {
    position:absolute;
    right:18px;
    bottom:120px;
    width:52px;
    padding:3px 0;
    border:0;
    border-radius:10px;
    background:rgba(0,0,0,0.55);
    color:white;
    font-size:42px;
    line-height:1.1;
    cursor:pointer;
    z-index:35;
    user-select:none;
    touch-action:manipulation;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
}
#snailBtn .speed-label {
    display:block;
    font: bold 12px Arial, sans-serif;
    margin-top:3px;
}
#snailBtn[data-speed-active="true"] {
    background:rgba(255,193,7,0.85);
    color:black;
}
#snailBtn:focus-visible {
    outline:2px solid white;
    outline-offset:3px;
}

/* Heart Button */
#heartBtn {
    position:absolute;
    right:18px;
    bottom:56px;
    font-size:42px;
    cursor:pointer;
    z-index:35;
    user-select:none;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
}

.heart-pulse {
    animation:heartPulse 0.4s ease-in-out;
}

@keyframes heartPulse {
    0% { transform:scale(1); }
    50% { transform:scale(1.35); }
    100% { transform:scale(1); }
}
</style>
</head>
<body>
<div id="page">

    <div id="videoContainer">
        <video id="video" muted preload="auto" playsinline></video>
    </div>

    <div id="overlay">Click to Start</div>
    <div id="pageNumber">1 / 14</div>

    <input type="range" id="playBar" min="0" max="100" value="0">
    <button type="button" id="snailBtn" aria-label="Speed: 100%. Click for 150%." title="Speed: 100%. Click for 150%."><span aria-hidden="true">🐌</span><span class="speed-label" aria-hidden="true">100%</span></button>
    <div id="heartBtn">❤️</div>

</div>

<script>
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const page = document.getElementById("page");
const pageNumber = document.getElementById("pageNumber");
const playBar = document.getElementById("playBar");
const heartBtn = document.getElementById("heartBtn");

/*
   SEVEN-VIDEO PAGE SETUP
   ----------------------
   This keeps the same 14 page sections from your original single video,
   with 2 page sections assigned to each MP4.

   Expected files:
   video1.mp4 = original time 0 onward
   video2.mp4 = starts at original time 33
   video3.mp4 = starts at original time 63
   video4.mp4 = starts at original time 120
   video5.mp4 = starts at original time 189
   video6.mp4 = starts at original time 260
   video7.mp4 = starts at original time 394

   Because each MP4 starts at 0, the times below are rebased for each file.
*/
const pages = [
    // VIDEO 1 - original pages 1-2
    { src:"video1.mp4", start:0,  end:17  },
    { src:"video1.mp4", start:16,  end:34 },
    { src:"video1.mp4", start:34,  end:52 },
    { src:"video1.mp4", start:52,  end:92 },
    { src:"video1.mp4", start:92,  end:141 }
];

let currentPage = 0;
let currentSrc = "";
let started = false;
let startY = null;
let scrubbing = false;
let loadRequest = 0;

function waitForVideoReady(){
    if(video.readyState >= 1) return Promise.resolve();

    return new Promise((resolve, reject) => {
        const onReady = () => {
            cleanup();
            resolve();
        };

        const onError = () => {
            cleanup();
            reject(new Error(`Could not load ${video.src}`));
        };

        const cleanup = () => {
            video.removeEventListener("loadedmetadata", onReady);
            video.removeEventListener("error", onError);
        };

        video.addEventListener("loadedmetadata", onReady, { once:true });
        video.addEventListener("error", onError, { once:true });
    });
}

/* Load a page, switching video files when needed */
async function loadPage(i, direction=0){
    if(i < 0 || i >= pages.length) return;

    const requestId = ++loadRequest;
    const wasPlaying = started && !video.paused;
    const target = pages[i];

    currentPage = i;
    pageNumber.innerText = `${currentPage + 1} / ${pages.length}`;
    playBar.value = 0;

    if(direction !== 0){
        video.style.transform = `translateY(${direction * 100}%)`;
        setTimeout(() => video.style.transform = "translateY(0%)", 50);
    }

    try {
        if(currentSrc !== target.src){
            currentSrc = target.src;
            video.src = target.src;
            video.load();
            await waitForVideoReady();
        }

        if(requestId !== loadRequest) return;

        video.currentTime = target.start;

        if(started && (wasPlaying || video.paused)){
            await video.play();
        }
    } catch(err){
        console.error(err);
    }
}

/* Loop current page + update play bar */
video.addEventListener("timeupdate", () => {
    if(!started) return;

    const { start, end } = pages[currentPage];

    if(video.currentTime >= end){
        video.currentTime = start;
        video.play().catch(err => console.error(err));
    }

    if(!scrubbing){
        const progress = (video.currentTime - start) / (end - start);
        playBar.value = Math.max(0, Math.min(100, progress * 100));
    }
});

/* Click overlay to start video */
overlay.addEventListener("click", async e => {
    e.stopPropagation();
    if(started) return;

    started = true;
    overlay.style.display = "none";

    playBar.style.opacity = "1";
    playBar.style.pointerEvents = "auto";
    heartBtn.style.opacity = "1";
    heartBtn.style.pointerEvents = "auto";
    snailBtn.style.opacity = "1";
    snailBtn.style.pointerEvents = "auto";

    video.muted = false;
    await loadPage(0);
});

/* Click page to pause/play */
page.addEventListener("click", () => {
    if(!started) return;
    video.paused
        ? video.play().catch(err => console.error(err))
        : video.pause();
});

/* Play bar scrubbing */
playBar.addEventListener("input", e => {
    e.stopPropagation();
    if(!started) return;

    scrubbing = true;
    const { start, end } = pages[currentPage];
    video.currentTime = start + (playBar.value / 100) * (end - start);
});

playBar.addEventListener("change", e => {
    e.stopPropagation();
    scrubbing = false;
});

/* Prevent clicking the slider from also pausing the video */
playBar.addEventListener("click", e => e.stopPropagation());

/* Cycle through 50%, 100%, and 150% without pausing or changing steps. */
const snailBtn = document.getElementById("snailBtn");
const playbackSpeeds = [0.5, 1, 1.5];
let playbackSpeed = 1;
function applyPlaybackSpeed(){
    video.defaultPlaybackRate = playbackSpeed;
    video.playbackRate = playbackSpeed;
}
snailBtn.addEventListener("click", e => {
    e.stopPropagation();
    if(!started) return;
    const nextIndex = (playbackSpeeds.indexOf(playbackSpeed) + 1) % playbackSpeeds.length;
    playbackSpeed = playbackSpeeds[nextIndex];
    applyPlaybackSpeed();
    const currentPercent = `${Math.round(playbackSpeed * 100)}%`;
    const nextPercent = `${Math.round(playbackSpeeds[(nextIndex + 1) % playbackSpeeds.length] * 100)}%`;
    snailBtn.dataset.speedActive = String(playbackSpeed !== 1);
    snailBtn.setAttribute("aria-label", `Speed: ${currentPercent}. Click for ${nextPercent}.`);
    snailBtn.title = snailBtn.getAttribute("aria-label");
    snailBtn.querySelector(".speed-label").textContent = currentPercent;
});
// Keep gestures on this button from triggering page navigation.
["mousedown", "mouseup", "touchstart", "touchend"].forEach(type => {
    snailBtn.addEventListener(type, e => e.stopPropagation());
});
video.addEventListener("loadedmetadata", applyPlaybackSpeed);

/* Heart button animation */
heartBtn.addEventListener("click", e => {
    e.stopPropagation();
    heartBtn.classList.remove("heart-pulse");
    void heartBtn.offsetWidth;
    heartBtn.classList.add("heart-pulse");
});

/* Drag / swipe navigation */
page.addEventListener("mousedown", e => startY = e.clientY);
page.addEventListener("mouseup", e => {
    if(!started || startY === null) return;

    const diff = startY - e.clientY;
    startY = null;

    if(Math.abs(diff) > 60){
        diff < 0
            ? loadPage(currentPage + 1, -1)
            : loadPage(currentPage - 1, 1);
    }
});

page.addEventListener("touchstart", e => {
    startY = e.touches[0].clientY;
}, { passive:true });

page.addEventListener("touchend", e => {
    if(!started || startY === null) return;

    const diff = startY - e.changedTouches[0].clientY;
    startY = null;

    if(Math.abs(diff) > 50){
        diff < 0
            ? loadPage(currentPage + 1, -1)
            : loadPage(currentPage - 1, 1);
    }
});

/* Mouse wheel navigation */
page.addEventListener("wheel", e => {
    if(!started) return;

    e.deltaY < 0
        ? loadPage(currentPage + 1, -1)
        : loadPage(currentPage - 1, 1);
});

/* Preload the first video without starting playback */
video.src = pages[0].src;
currentSrc = pages[0].src;
video.load();
</script>
</body>
</html>
